<!doctype html>
<html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="theme-color" content="#0e1620"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Warlords">
<title>Warlords – The New Age</title>
<style>:root{--bg:#0d141c;--panel:#17212c;--panel2:#1f2c3a;--gold:#d4a93c;--gold2:#f2d27a;--text:#ece5d0;--muted:#97a3b0;--pos:#7fe08a;--neg:#ff8a7a;--line:#3a4a5c}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:14px/1.35 "Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;user-select:none}
#app{position:fixed;inset:0}
#map{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
.hidden{display:none!important}
button,select,input{font:inherit}
.btn{background:linear-gradient(#2b3b4d,#1d2a38);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:7px 14px;cursor:pointer;transition:.12s}
.btn:hover:not(:disabled){border-color:var(--gold);color:#fff;transform:translateY(-1px)}
.btn:disabled{opacity:.4;cursor:default}
.btn.gold{background:linear-gradient(#e2bb55,#b4872a);color:#1a1208;border-color:#f2d27a;font-weight:bold;text-shadow:0 1px 0 rgba(255,255,255,.3)}
.btn.gold:hover:not(:disabled){color:#000;filter:brightness(1.1)}
.btn.danger:hover:not(:disabled){border-color:#ff6b5a;color:#ff8a7a}
.btn.sm{padding:4px 9px;font-size:13px}.btn.xs{padding:2px 7px;font-size:12px}
.btn.big{padding:12px 26px;font-size:18px;min-width:260px}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.hint{color:var(--muted);font-size:12.5px}
.row{display:flex;align-items:center;gap:10px;margin:8px 0;flex-wrap:wrap}
.btnrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.btnrow.wrap{gap:6px}
.center{text-align:center}.big{font-size:18px}
.txt{background:#0f1820;border:1px solid var(--line);color:var(--text);padding:7px 10px;border-radius:6px;flex:1;min-width:0}.txt.short{flex:0 0 120px}
select{background:#0f1820;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:5px 8px}
/* screens */
.screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(5,10,16,.35),rgba(5,10,16,.85))}
.title-box{text-align:center}
.logo1{font-size:92px;letter-spacing:10px;font-weight:bold;color:var(--gold2);text-shadow:0 3px 0 #7a5410,0 0 40px rgba(212,169,60,.5),0 6px 18px #000;line-height:1}
.logo2{font-size:28px;letter-spacing:6px;color:#e7dcc0;margin:6px 0 28px;text-shadow:0 2px 8px #000}
.title-menu{display:flex;flex-direction:column;gap:10px;align-items:center}
.title-foot{margin-top:26px;color:#b9c3cc;font-size:12px;text-shadow:0 1px 4px #000}
#setup{overflow:auto;align-items:flex-start}
.setup-box{background:rgba(18,27,38,.96);border:2px solid var(--gold);border-radius:12px;margin:20px;padding:18px 22px;max-width:1280px;width:100%;box-shadow:0 10px 40px #000}
.setup-head{display:flex;justify-content:space-between;align-items:center}
.setup-head h1{margin:0;color:var(--gold2);letter-spacing:3px}
.setup-cols{display:grid;grid-template-columns:1fr 1fr;gap:26px}
@media(max-width:1000px){.setup-cols{grid-template-columns:1fr}}
h3{color:var(--gold2);margin:12px 0 6px}
.mapgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.mapcard{background:var(--panel);border:2px solid var(--line);border-radius:8px;padding:8px;cursor:pointer}
.mapcard.on{border-color:var(--gold);background:#243447;box-shadow:0 0 14px rgba(212,169,60,.4)}
.mapcard h4{margin:6px 0 0;color:var(--gold2)}.mapcard p{margin:4px 0 0;font-size:12px;color:var(--muted)}
.mappreview{width:100%;height:auto;border-radius:4px;image-rendering:pixelated;display:block}
.seg{display:flex;gap:6px}
.slots{display:flex;flex-direction:column;gap:6px}
.slot{display:grid;grid-template-columns:24px 44px 1fr 250px;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--fc);border-radius:8px;padding:6px 10px}
.slot.off{opacity:.5}.slot.me{background:#26384c;border-color:var(--gold);border-left-color:var(--fc)}
.sname small{color:var(--muted);margin-left:6px}.swatch{display:inline-block;width:14px;height:14px;border-radius:3px;border:1px solid #000;margin-left:8px;vertical-align:-2px}
.sstyle{font-size:11.5px;color:var(--muted);line-height:1.25}
.setup-foot{display:flex;justify-content:space-between;align-items:center;margin-top:14px}
/* HUD */
#game{position:absolute;inset:0;pointer-events:none}
#game>*{pointer-events:auto}
#topbar{position:absolute;left:0;right:0;top:0;height:58px;display:flex;align-items:center;gap:12px;padding:0 12px;background:linear-gradient(#1c2a3a,#121b26);border-bottom:3px solid var(--fc,#d4a93c);box-shadow:0 4px 14px rgba(0,0,0,.6)}
.tb-faction{display:flex;gap:8px;align-items:center;border-left:4px solid;padding-left:8px}
.fname{font-weight:bold;font-size:16px;line-height:1.1}.fsub{font-size:11px;color:var(--muted)}
.stat{display:flex;flex-direction:column;align-items:center;min-width:54px;line-height:1.1}.stat span{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}.stat b{font-size:18px}.stat small{font-size:11px}
.stat.gold b{color:var(--gold2)}
.tb-spacer{flex:1}
.endturn{padding:9px 20px;font-size:16px}
#players{position:absolute;left:10px;top:66px;display:flex;gap:5px;flex-wrap:wrap;max-width:calc(100% - 370px)}
.pchip{display:flex;align-items:center;gap:5px;background:rgba(15,22,31,.86);border:1px solid var(--line);border-bottom:3px solid var(--fc);border-radius:7px;padding:2px 8px 2px 4px;cursor:pointer;font-size:12px;position:relative}
.pchip small{color:var(--muted)}
.pchip.active{background:rgba(48,64,84,.96);border-color:var(--fc);box-shadow:0 0 0 2px var(--fc),0 0 16px var(--fc);transform:translateY(2px);font-weight:bold}
.pchip.active::before{content:"▶";color:var(--fc);margin-right:2px;text-shadow:0 0 4px #000}
.pchip.dead{opacity:.35;text-decoration:line-through}
.pchip i{font-style:normal;font-size:11px}.pchip i.war{color:#ff7a6a}.pchip i.peace{color:#8fe0a0}
#side{position:absolute;right:10px;top:68px;bottom:12px;width:336px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding-right:2px}
#side::-webkit-scrollbar,.modal-body::-webkit-scrollbar{width:8px}#side::-webkit-scrollbar-thumb,.modal-body::-webkit-scrollbar-thumb{background:#3a4a5c;border-radius:4px}
.card{background:rgba(23,33,44,.95);border:1px solid var(--line);border-left:5px solid var(--gold);border-radius:8px;padding:8px 10px;box-shadow:0 3px 10px rgba(0,0,0,.5)}
.card.offer{border-left-color:#ffd86b;background:rgba(60,48,20,.95)}.card.target{border-left-color:#ff9d5c}
.ctitle{font-weight:bold;color:var(--gold2);margin-bottom:4px}.ctitle small{color:var(--muted);font-weight:normal}
.site{margin-top:4px;color:#c9b6f5}.site small{display:block;color:var(--muted)}
.cinfo{display:flex;gap:12px;flex-wrap:wrap;font-size:13px}
.odds{font-weight:bold;font-size:16px;margin:4px 0}.odds.good{color:var(--pos)}.odds.mid{color:#ffd86b}.odds.bad{color:var(--neg)}
.ulist{display:flex;flex-direction:column;gap:3px;max-height:330px;overflow-y:auto}
.urow{display:grid;grid-template-columns:auto auto 1fr auto auto;gap:6px;align-items:center;background:#111a24;border-radius:6px;padding:3px 6px;flex-wrap:wrap}
.urow input{margin:0}.urow.spent{opacity:.6}.urow .items{grid-column:1/-1;padding-left:34px;font-size:12px;color:#ffd86b}.item{margin-right:3px;cursor:help}
.uname{font-size:13px;min-width:0}.ustat{font-size:12px;color:var(--muted);min-width:34px;text-align:right}.bless{color:#9fd8ff}
.hpbar{height:5px;background:#341919;border-radius:3px;overflow:hidden;margin-top:2px}.hpbar i{display:block;height:100%;background:linear-gradient(90deg,#c43d3d,#6fd06f)}.hpbar.prog i{background:linear-gradient(90deg,#c9992f,#f2d27a)}
.uicon{vertical-align:middle}
.chips{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:5px}.chip{background:#111a24;border:1px solid var(--line);color:var(--text);border-radius:12px;padding:2px 9px;cursor:pointer;font-size:12px}.chip.on{border-color:var(--gold);background:#2d3d50}
.prodlist{display:flex;flex-direction:column;gap:3px;margin-top:6px}
.prow{display:grid;grid-template-columns:auto 1fr auto auto;gap:6px;align-items:center;background:#111a24;border:1px solid transparent;border-radius:6px;padding:3px 6px}.prow.on{border-color:var(--gold);background:#2a3a28}
.pn small{display:block;color:var(--muted);font-size:11px}.pc{color:var(--gold2);font-weight:bold}.pb{display:flex;gap:3px}
.prodnow{margin:4px 0;font-size:13px}.qline{font-size:12px;margin:3px 0}.qitem{background:#111a24;border-radius:10px;padding:1px 7px;margin-right:3px;cursor:pointer}.qitem:hover{color:var(--neg)}
.chk{cursor:pointer;font-size:13px}.chk.row{margin:8px 0}
.card.help ul{margin:4px 0 0 16px;padding:0;color:var(--muted);font-size:13px}
#bottomleft{position:absolute;left:10px;bottom:10px;display:flex;flex-direction:column;gap:4px}
#minimap{width:240px;height:160px;border:3px solid var(--gold);border-radius:6px;background:#0a1118;cursor:pointer;box-shadow:0 4px 14px #000}
#hoverinfo{background:rgba(10,16,22,.85);padding:2px 8px;border-radius:5px;font-size:12px;min-height:20px;max-width:380px}
#banner{position:absolute;left:50%;top:104px;transform:translateX(-50%);background:rgba(14,22,32,.94);border:2px solid var(--gold);border-radius:20px;padding:6px 20px;font-size:15px;pointer-events:none;box-shadow:0 0 18px rgba(0,0,0,.7)}
#toasts{position:fixed;top:112px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:30;pointer-events:none;align-items:center}
.toast{background:rgba(20,30,42,.95);border:1px solid var(--gold);border-radius:8px;padding:7px 16px;box-shadow:0 4px 16px #000;transition:.5s;max-width:720px;text-align:center}
.toast.warn{border-color:#ff8a7a;color:#ffd0c8}.toast.hero{border-color:#c9a3ff}.toast.capture{border-color:#ffd86b;background:rgba(60,48,20,.95)}.toast.out{opacity:0;transform:translateY(-10px)}
/* modals */
#modals{position:fixed;inset:0;z-index:40;pointer-events:none}
.modal-back{position:fixed;inset:0;background:rgba(3,7,12,.65);display:flex;align-items:center;justify-content:center;pointer-events:auto;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.modal{background:linear-gradient(#1c2a3a,#141e2a);border:2px solid var(--gold);border-radius:12px;min-width:340px;max-width:min(96vw,720px);max-height:92vh;display:flex;flex-direction:column;box-shadow:0 12px 50px #000}
.modal.wide{max-width:min(96vw,1000px);width:900px}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line)}
.modal-head h2{margin:0;color:var(--gold2);font-size:20px}.x{background:none;border:none;color:var(--muted);font-size:28px;cursor:pointer;line-height:1}.x:hover{color:#fff}
.modal-body{padding:12px 18px 16px;overflow:auto}
.modal-body.menu{display:flex;flex-direction:column;gap:10px;align-items:center}
.tbl{width:100%;border-collapse:collapse;margin:6px 0}.tbl th{text-align:left;color:var(--gold2);border-bottom:1px solid var(--line);padding:4px 8px;font-size:12px;text-transform:uppercase;letter-spacing:1px}.tbl td{padding:4px 8px;border-bottom:1px solid #22303f}.tbl tr.dead{opacity:.4}
.iconcell{display:inline-flex;align-items:center;gap:6px}
.econgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.econgrid div{background:#111a24;border-radius:8px;padding:8px;text-align:center}.econgrid span{display:block;color:var(--muted);font-size:12px}.econgrid b{font-size:22px}
.prop{background:#2a3a28;border-radius:8px;padding:8px;margin:6px 0}
.saverow{display:flex;gap:8px;margin-bottom:10px}
.savelist{display:flex;flex-direction:column;gap:6px;max-height:50vh;overflow:auto}
.saveitem{display:flex;gap:10px;align-items:center;background:#111a24;border:1px solid var(--line);border-radius:8px;padding:6px 10px}.sinfo{flex:1;min-width:0}.sinfo small{display:block;color:var(--muted)}.sbtn{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;max-width:330px}
.badge{background:#3a5a8a;border-radius:4px;font-size:10px;padding:1px 5px;margin-left:8px;vertical-align:1px}
.fcard{display:flex;gap:12px;border-left:5px solid;background:#111a24;border-radius:8px;padding:8px 12px;margin:8px 0;align-items:center}.fcard h3{margin:0}.fcard p{margin:3px 0}.fcard small{color:var(--muted)}
.help h3{margin:14px 0 2px}.help p,.help li{color:#d4d9de;line-height:1.5}
/* battle */
.battle{min-width:min(92vw,760px)}
.bsides{display:grid;grid-template-columns:1fr 50px 1fr;gap:10px;align-items:start}.bsides h3{text-align:center;margin:0 0 6px}.vs{font-size:34px;text-align:center;align-self:center}
.bcol{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.bcard{background:#111a24;border:2px solid var(--line);border-radius:8px;padding:5px;text-align:center;font-size:12px;transition:.12s}
.bcard.fight{border-color:var(--gold);transform:scale(1.07);box-shadow:0 0 14px var(--gold)}.bcard.hit{background:#5a2020;transform:translateX(3px) scale(1.07)}.bcard.act{border-color:#9fd8ff}.bcard.dead{opacity:.28;filter:grayscale(1)}
.bname{font-weight:bold}.bstr{color:var(--muted)}.bhp{font-size:11px}
.blog{text-align:center;font-size:18px;min-height:30px;margin-top:12px}.blog.win{color:var(--gold2)}.blog.lose{color:var(--neg)}
/* ---- modern skin ---- */
html,body{font:14px/1.4 "Segoe UI",Inter,system-ui,-apple-system,Roboto,sans-serif}
h2,h3,.logo1,.logo2,.ctitle,.fname{font-family:"Palatino Linotype",Palatino,Georgia,serif}
:root{--glass:rgba(16,24,34,.72);--glass2:rgba(26,38,52,.78);--line:rgba(255,255,255,.12)}
#topbar{background:linear-gradient(180deg,rgba(18,28,40,.88),rgba(12,18,27,.78));backdrop-filter:blur(14px) saturate(1.3);border-bottom:2px solid var(--fc,#d4a93c);box-shadow:0 6px 24px rgba(0,0,0,.45)}
.card{background:var(--glass);backdrop-filter:blur(12px) saturate(1.25);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.pchip{background:var(--glass);backdrop-filter:blur(10px);border-radius:999px;border:1px solid var(--line);border-bottom:3px solid var(--fc);padding:3px 10px 3px 5px}
.btn{background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:9px;backdrop-filter:blur(6px)}
.btn:hover:not(:disabled){background:rgba(255,255,255,.14);border-color:var(--gold2)}
.btn.gold{background:linear-gradient(135deg,#f0c75a,#d19a2b);border:none;color:#201404;box-shadow:0 4px 14px rgba(212,169,60,.35)}
.modal{background:linear-gradient(160deg,rgba(28,40,56,.96),rgba(14,20,30,.97));border:1px solid rgba(242,210,122,.55);border-radius:16px;box-shadow:0 20px 70px rgba(0,0,0,.7)}
.modal-back{backdrop-filter:blur(5px)}
.urow,.prow,.saveitem,.econgrid div,.fcard,.bcard{background:rgba(255,255,255,.05);border-radius:10px}
.prow.on{background:rgba(120,190,100,.18)}
.slot,.mapcard{background:var(--glass2);border-radius:12px}
.setup-box{background:rgba(14,22,32,.9);backdrop-filter:blur(16px);border-radius:18px}
.toast{background:var(--glass2);backdrop-filter:blur(12px);border-radius:12px}
#minimap{border:2px solid rgba(242,210,122,.8);border-radius:12px}
#hoverinfo{background:var(--glass);backdrop-filter:blur(8px);border-radius:8px}
.hpbar{height:6px;border-radius:6px}
/* ---- modern battle scene ---- */
.battle{min-width:min(94vw,820px)}
.arena{position:relative;height:230px;border-radius:14px;overflow:hidden;border:1px solid rgba(255,255,255,.18);box-shadow:inset 0 0 60px rgba(0,0,0,.55);display:grid;grid-template-columns:1fr 64px 1fr;align-items:end;padding:44px 18px 14px;background:linear-gradient(180deg,#8ec0e8 0%,#c9e2f2 38%,#4c7a3a 38.2%,#2c4f26 100%)}
.arena::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 120%,rgba(0,0,0,.45),transparent 60%);pointer-events:none}
.arena.terr1{background:linear-gradient(180deg,#7fa9c0 0%,#bcd7c8 34%,#2b5a2d 34.2%,#173a1b 100%)}
.arena.terr2{background:linear-gradient(180deg,#9ac1dd 0%,#d9e8f0 36%,#7d7c46 36.2%,#4f4e2a 100%)}
.arena.terr3{background:linear-gradient(180deg,#a8b7c8 0%,#dfe4ea 30%,#6a6c74 30.2%,#3c3f48 100%)}
.arena.terr4{background:linear-gradient(180deg,#8aa59a 0%,#c0cfc2 36%,#475e48 36.2%,#27382b 100%)}
.arena.terr5{background:linear-gradient(180deg,#9fd0f0 0%,#e0f1fb 36%,#2a5f95 36.2%,#123a62 100%)}
.arena.city{background:linear-gradient(180deg,#8ea6c4 0%,#cbd6e4 30%,#9c9280 30.2%,#625a4c 100%)}
.arena.city::before{content:"";position:absolute;left:0;right:0;top:44px;height:62px;background:repeating-linear-gradient(90deg,#b9b19d 0 26px,transparent 26px 40px),linear-gradient(#a79f8b,#7d7566);-webkit-mask:linear-gradient(#000,#000);opacity:.85;clip-path:polygon(0 30%,4% 30%,4% 0,12% 0,12% 30%,20% 30%,20% 0,28% 0,28% 30%,36% 30%,36% 0,44% 0,44% 30%,52% 30%,52% 0,60% 0,60% 30%,68% 30%,68% 0,76% 0,76% 30%,84% 30%,84% 0,92% 0,92% 30%,100% 30%,100% 100%,0 100%)}
.arena.monsters{background:linear-gradient(180deg,#2a1a3a 0%,#4a2f5e 36%,#2a1d33 36.2%,#150d1c 100%)}
.arena.shake{animation:ashake .12s linear}
@keyframes ashake{0%{transform:translate(0,0)}25%{transform:translate(-3px,1px)}50%{transform:translate(3px,-1px)}75%{transform:translate(-2px,0)}100%{transform:translate(0,0)}}
.abanner{position:absolute;top:10px;padding:4px 14px;font:bold 14px Georgia,serif;color:#fff;background:linear-gradient(180deg,var(--c),color-mix(in srgb,var(--c) 55%,#000));border-radius:4px 4px 12px 12px;box-shadow:0 3px 10px rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.35);text-shadow:0 1px 2px #000;z-index:2}
.abanner.l{left:14px}.abanner.r{right:14px}
.fighter{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:3px;transition:transform .12s ease-out,filter .1s;min-height:140px;justify-content:flex-end}
.fighter.empty{opacity:0}
.fico{width:92px;height:92px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--c) 70%,#fff),var(--c) 55%,color-mix(in srgb,var(--c) 40%,#000));border:3px solid rgba(255,255,255,.75);box-shadow:0 8px 18px rgba(0,0,0,.55),inset 0 -8px 14px rgba(0,0,0,.3)}
.fa .fico{border-color:#ffe08a}.fd .fico{border-color:#b9d4ff}
.fa.lunge{transform:translateX(26px) scale(1.07)}.fd.lunge{transform:translateX(-26px) scale(1.07)}
.fighter.hurt .fico{filter:brightness(1.8) saturate(.6);box-shadow:0 0 22px #ff3b2e}
.fighter.ko{opacity:.35;filter:grayscale(1);transform:translateY(10px) rotate(-6deg)}
.fname2{font:bold 13px Georgia,serif;color:#fff;text-shadow:0 1px 3px #000}
.fhp{width:112px;height:9px;border-radius:5px;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.4);overflow:hidden}
.fhp i{display:block;height:100%;background:linear-gradient(180deg,#8cf08c,#2fa84a);transition:width .12s}.fhp i.low{background:linear-gradient(180deg,#ff8a7a,#d12f22)}
.fstat{font-size:11px;color:#f2f2f2;text-shadow:0 1px 2px #000}
.arena .vs{z-index:1;align-self:center;font-size:34px;text-shadow:0 2px 10px #000;color:#fff;text-align:center}
.dmg{position:absolute;top:0;left:50%;font:bold 22px Georgia,serif;color:#ff5a4a;text-shadow:0 2px 4px #000,0 0 8px #000;animation:dmgup .8s ease-out forwards;pointer-events:none;z-index:3}
.dmg.arr{color:#ffd24a}.dmg.miss{color:#d9d9e6;font-size:15px}

WL.HELP_EN = turns => `<h3>Goal</h3><p>Capture cities, build armies and defeat the other factions. The game is turn-based; all factions (including the computer) follow the same rules.</p>
<h3>Controls</h3><ul><li><b>Left-click</b>: select city/army. With an army selected: click a tile to preview the path (and battle odds), click again to go.</li><li><b>Right-click</b>: move/attack immediately. Multi-turn trips continue automatically next turn.</li><li><b>Drag</b> with the mouse or use the arrow keys: move the map. <b>Wheel</b> / +/-: zoom. The minimap is clickable.</li><li><b>Enter/N</b> next army · <b>E</b> end turn · <b>S</b> sleep · <b>Z</b>/Ctrl+Z undo move · <b>Tab</b> next city · <b>C</b>/<b>A</b>/<b>D</b> cities/armies/diplomacy · <b>Ctrl+S</b> save · <b>G</b> grid · <b>Numpad</b> single steps.</li></ul>
<h3>Cities and economy</h3><p>Each city produces certain units. You pay the unit's price when production starts; the finished unit appears after the production time. Every unit costs upkeep each turn – if gold runs out, the weakest units desert. Strengthen defenses or build up the economy in the city panel.</p>
<h3>Roads and terrain</h3><p>Roads connect some of the cities. A road tile (and cities) costs 1 step, plains 2, forest and hills 4, mountains 6 (for infantry – riders, flyers, dwarves and wolves have their own costs). Use roads to get there quickly.</p>
<h3>Experience</h3><p>The hero levels up (to 9) and becomes stronger. Ordinary units get 1 experience for each battle they win and survive: <b>Veteran ★</b> (3 xp) gives +1 strength, <b>Elite ★★</b> (8 xp) gives +2. Experience stays with the unit, so it pays to keep your best units alive. Rank is shown in the army list.</p><h3>Auto-orders, rally point and replay</h3><p><b>Auto-orders:</b> select an army and a destination that is more than one turn away – the army keeps marching at the start of each turn (yellow dashed line and flag). The army stops if enemies are nearby, and you get a notice. «Stop order» cancels.</p><p><b>Rally point:</b> select a city and press «Pick on the map» at Rally point (or «All cities»). New units from the city gather and march there automatically – blue dashed line. Together with the production queue and «Repeat production» you can reinforce a front-line city without moving each unit.</p><p><b>Replay:</b> when your turn starts, you can watch what the others did since last time (↺ Replay at the top or in ☰). You can set the speed, skip to the next player's turn or show only battles and conquests. Esc closes.</p><h3>Team play</h3><p>Under <b>New game</b> you can choose <b>Team play</b> (e.g. 2 vs 2 or 3 vs 3) or set a team per faction. Teams must be chosen before the game starts. Teammates are allied forever: they cannot attack each other, and you win together when everyone else is eliminated. Armies and cities cannot enter a teammate's tile. You can mix humans and AI on the same team.</p><h3>Online game</h3><p>Choose <b>Online game → Host</b>, set the desired factions to <i>Online – friend</i> and press Start. You get an invitation code per friend; the friend chooses <b>Join a friend's game</b>, pastes the code and sends an answer code back, which you paste and press Connect. The game runs directly between your browsers (no server) and is played in turns. If a friend leaves, the AI takes over their faction.</p>
<h3>Armies and combat</h3><p>An army holds up to 8 units. All armies on a tile defend together. Combat is decided in duels: the probability depends on strength (terrain, city defense, heroes and items) – stamina is kept as wounds, which heal in cities and by resting. Archers shoot first. Cavalry has +1 when attacking on open land, Dwarves +1 in hills/mountains, Wolves +1 in forest.</p>
<h3>Ships</h3><p>Navy can only be produced in port cities, sails on water and carries 4 land units each. Sail to a water tile on the coast and attack/land on a neighboring tile. Land units can board by moving onto a water tile with a fleet.</p>
<h3>Heroes</h3><p>Heroes explore ruins (gold, items, allies – but also guardians), temples (+1 strength for the whole army, once per unit), libraries (+1 level) and sage towers. Items give bonuses to the whole army. Heroes are offered regularly in your cities for a fee.</p>
<h3>Diplomacy</h3><p>You can propose peace; the AI evaluates the proposal. Peace prevents attacks between the parties for at least ${turns} turns.</p>
<h3>Saving</h3><p>The game autosaves after every finished round (3 rotating slots) and you can save any number of named games under Save/Load. Saved games can be exported and imported as JSON files.</p>`;

// ---------- RNG (seedable, state kept in game state so saves are deterministic) ----------
WL.mulberry = function (a) { // pure: returns [value, newState]
  a = (a + 0x6D2B79F5) | 0;
  let t = Math.imul(a ^ (a >>> 15), 1 | a);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return [((t ^ (t >>> 14)) >>> 0) / 4294967296, a];
};
WL.makeRng = function (seed) {
  let s = seed | 0;
  const f = () => { const r = WL.mulberry(s); s = r[1]; return r[0]; };
  f.int = n => Math.floor(f() * n);
  f.pick = a => a[Math.floor(f() * a.length)];
  return f;
};

// ============================================================ Pathfinding

// Dijkstra from the army tile. Returns {dist, prev, mode}

// ============================================================ Step execution

// ============================================================ Battle

}

function performAttack(S, army, plan, x, y) {

U.openHelp = function () {
  const body = h('div', { class: 'modal-body help' });
  body.innerHTML = WL.lang === 'en' ? WL.HELP_EN(WL.PEACE_MIN_TURNS) : `<h3>Mål</h3><p>Erobr byer, byg hære og besejr de andre fraktioner. Spillet er turbaseret; alle fraktioner (også computeren) følger de samme regler.</p>
<h3>Styring</h3><ul><li><b>Venstreklik</b>: vælg by/hær. Med en hær valgt: klik et felt for at se vejen (og kampchancen), klik igen for at gå.</li><li><b>Højreklik</b>: gå/angrib med det samme. Flerturs-ture fortsætter automatisk næste tur.</li><li><b>Træk</b> med musen eller piletasterne: flyt kortet. <b>Hjul</b> / +/-: zoom. Minikortet kan klikkes.</li><li><b>Enter/N</b> næste hær · <b>E</b> afslut tur · <b>S</b> sov · <b>Z</b>/Ctrl+Z fortryd flytning · <b>Tab</b> næste by · <b>C</b>/<b>A</b>/<b>D</b> byer/hære/diplomati · <b>Ctrl+S</b> gem · <b>G</b> gitter · <b>Numpad</b> enkeltskridt.</li></ul>
<h3>Byer og økonomi</h3><p>Hver by producerer bestemte enheder. Du betaler enhedens pris, når produktionen starter; den færdige enhed kommer efter produktionstiden. Hver enhed koster vedligeholdelse hver tur – løber guldet tør, deserterer de svageste enheder. Forstærk forsvaret eller udbyg økonomien i byens panel.</p>
<h3>Veje og terræn</h3><p>Veje forbinder nogle af byerne. Et felt med vej (og byer) koster 1 skridt, slette 2, skov og høje 4, bjerge 6 (for fodfolk – ryttere, flyvere, dværge og ulve har egne takster). Brug vejene til at komme hurtigt frem.</p>
<h3>Erfaring</h3><p>Helten stiger i niveau (op til 9) og bliver stærkere. Almindelige enheder får 1 erfaring for hver kamp, de vinder og overlever: <b>Veteran ★</b> (3 xp) giver +1 styrke, <b>Elite ★★</b> (8 xp) giver +2. Erfaringen følger enheden, så det kan betale sig at holde dine bedste hold i live. Rang vises i hærlisten.</p><h3>Autoture, samlingspunkt og replay</h3><p><b>Autoture:</b> vælg en hær og et mål, der ligger længere væk end én tur – hæren marcherer selv videre i starten af hver tur (gul stiplet linje og flag). Hæren stopper, hvis der er fjender i nærheden, og du får besked. «Stop ordre» annullerer.</p><p><b>Samlingspunkt:</b> vælg en by og tryk «Vælg på kortet» ved Samlingspunkt (eller «Alle byer»). Nye enheder fra byen samles og marcherer automatisk dertil – blå stiplet linje. Sammen med produktionskøen og «Gentag produktion» kan du forstærke en frontby uden at flytte hver enhed.</p><p><b>Replay:</b> når din tur starter, kan du se, hvad de andre gjorde siden sidst (↺ Replay øverst eller i ☰). Du kan sætte farten, springe til næste spillers tur eller kun se kampe og erobringer. Esc lukker.</p><h3>Holdspil</h3><p>Under <b>Nyt spil</b> kan du vælge <b>Holdspil</b> (fx 2 mod 2 eller 3 mod 3) eller sætte hold pr. fraktion. Hold skal vælges, før spillet starter. Holdkammerater er allierede for altid: de kan ikke angribe hinanden, og I vinder sammen, når alle andre er udslettet. Hære og byer kan ikke gå ind på en holdkammerats felt. Du kan blande mennesker og AI på samme hold.</p><h3>Online spil</h3><p>Vælg <b>Online spil → Vær vært</b>, sæt de ønskede fraktioner til <i>Online – ven</i> og tryk Start. Du får en invitationskode pr. ven; vennen vælger <b>Deltag i en vens spil</b>, indsætter koden og sender en svarkode tilbage, som du indsætter og trykker Forbind. Spillet kører direkte mellem jeres browsere (ingen server) og spilles skiftevis. Forlader en ven spillet, overtager AI hans fraktion.</p>
<h3>Hære og kamp</h3><p>En hær rummer op til 8 enheder. Alle hære på et felt forsvarer sammen. Kampen afgøres i dueller: sandsynligheden afhænger af styrke (terræn, byforsvar, helte og genstande) – udholdenhed bevares som sår, som heles i byer og ved hvile. Archers skyder først. Cavalry har +1 ved angreb på åbent land, Dwarves +1 i høje/bjerge, Wolves +1 i skov.</p>
<h3>Skibe</h3><p>Navy kan kun produceres i havnebyer, sejler på vand og bærer 4 landenheder hver. Sejl til et vandfelt ved kysten og angrib/landgå på et nabofelt. Landenheder kan gå ombord ved at gå ind på et vandfelt med en flåde.</p>
<h3>Helte</h3><p>Helte udforsker ruiner (guld, genstande, allierede – men også vogtere), tempel (+1 styrke til hele hæren, én gang pr. enhed), biblioteker (+1 niveau) og vismandstårne. Genstande giver bonusser til hele hæren. Helte tilbydes jævnligt i dine byer mod betaling.</p>
<h3>Diplomati</h3><p>Du kan foreslå fred; AI vurderer forslaget. Fred forhindrer angreb mellem parterne i mindst ${WL.PEACE_MIN_TURNS} ture.</p>
<h3>Gem</h3><p>Spillet autosaver efter hver afsluttet runde (3 roterende pladser) og du kan gemme uendeligt mange navngivne spil under Gem/Indlæs. Gemte spil kan eksporteres og importeres som JSON-filer.</p>`;
  U.modal(WL.tr('Hjælp'), body, { wide: true });
};
